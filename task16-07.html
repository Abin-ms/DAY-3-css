<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <style>
        body{
            background-color: lightblue;
        }
        
        .container{
            margin: auto;
            background-color: white;
            width: 450px;
            height: 450px;
            padding: 20px 10px;
            text-align: center;
            border: none;
            border-radius: 15px;
            box-shadow: 2px 3px 6px grey;
            padding-bottom: 2px;

        }
        img{
             border-radius: 50%;
            width: 200px;
            height: 200px;
            border: 1px solid black;
        }
        .hh{
            color: white;
            background-color: blue;
            padding: 10px 25px;
             border-radius: 9px;
             border: 1px solid blue;



        }
        .uu{
            color: blue;
            background-color: white;
            padding: 10px 18px;
            border: 1px solid blue;
            border-radius: 9px;

        }
        h1{
            font-size: 40px;
        }
        p{
            font: 18px;
            color: rgb(113, 110, 110);
        }
    </style>
   
</head>
<body>
    
        <div class="container">
        <img src="./IMG-20260609-WA0009.jpg" alt="">
        <h1>Abin M.S</h1>
        <p>Web Designer</p>
        <p>Alappuzha,Kerala,India</p>
        <button class="hh">Follow</button>&nbsp;&nbsp;
        <button class="uu">Message</button>
    </div>
    
</body>
</html>
