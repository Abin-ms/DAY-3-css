<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>
<style>
    li:first-child{
        color: blueviolet;
        background-color: aliceblue;
    }
    li:last-child{
        color: aquamarine;
        background-color: black;
    }
    li:nth-child(2){
        color: cadetblue;
    }
    li:nth-child(4){
        background-color: aliceblue;
    }


</style>
<body>
    <ul>
        <li>huh</li>
        <li>jjjj</li>
        <li>dddd</li>
        <li>ddadad</li>
    </ul>
</body>
</html>
