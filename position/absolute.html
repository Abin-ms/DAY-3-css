<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <style>
        .parent{
             height: 250px;
            width: 300px;
            background-color: blue;
            position: relative;
            top: 300px;
            left: 100px;
        }
        .child{
            height: 100px;
            width: 100px;
            background-color: cadetblue;
            position: absolute;
            top: 50px;
            left: 80px;
            right: 0;
        }
    </style>
</head>
<body>
    <div class="parent">
        <div class="child">
            absolute box
        </div>
    </div>
</body>
</html>
