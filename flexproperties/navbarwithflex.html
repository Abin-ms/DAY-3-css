<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>
<style>
    *{
        margin: 0;
        padding: 0;
        box-sizing: border-box;
    }
    nav{ 
        border: 1px solid black;
        padding: 30px;
        display: flex;
        justify-content: space-between;
        background-color: black;
        color: white;

    }
    .logo{
        /* border: 1px solid blue; */
        font-size: 25px;
    }
    .content{
        /* border: 2px solid green; */
        justify-content: center;
        display: flex;
        padding: 10px;
        gap: 60px;
    }
    .content a{
        text-decoration: none;
        color: white;
        font-size: 20px;
    }
    .content a:hover{
        color: yellow;
    }
    .logo:hover{
        
        cursor: pointer;
    }
    .container2{
        background-color: rgb(227, 216, 216);
        width: auto;
        height: 700px;
        display: flex ;
        justify-content: center;
        padding: 20px;
        background-image: url(../containerandinnercontainer/image.png);
        background-repeat: no-repeat;
        

    }
    .container2 h1{
        font-size: 60px;
    }
</style>
<body>
    <nav>
        <div class="logo">
            <h1>LOGO</h1>
        </div>

        <div class="content">
             <a href="">Home</a>
             <a href="">About</a>
             <a href="">Contact</a>
             <a href="">Logout</a>
        </div>
    </nav>
    <section class="container2">
     <h1>welcome to the website</h1>
    </section>
</body>
</html>
