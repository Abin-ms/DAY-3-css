<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.7.2/css/all.min.css" integrity="sha512-Evv84Mr4kqVGRNSgIGL/F/aIDqQb7xQ2vcrdIwxfjThSH8CSR7PBEakCr51Ck+w+/U6swU2Im1vVX0SVk9ABhg==" crossorigin="anonymous" referrerpolicy="no-referrer" />
    <style>
        .outer{
            /* margin: auto; */
            /* border: 2px solid black; */
            width: 300px;
            display: flex;
            flex-wrap: wrap;
            height: 420px;
           
            border-radius: 20px;
            overflow: hidden;
           box-shadow: 1px 1px 2px rgb(170, 167, 167);
           
        }
        
        .discount{
                    position: absolute;

        }

        .container{
            position: relative;
           
            
            
            /* border: 1px solid blue; */
            width: 300px;
            overflow: hidden;
            
        }

        article{
            padding: 15px;
            display: flex;
            flex-wrap: wrap;
            justify-content: space-between;
            /* align-items: start; */
            
            /* border: 1px solid red; */
        }
       
        article h2{
            margin-top: 1px;
            margin-right: 10px;
        }
        article span{
            margin-top: 4px;
            font-size: 15px;
            
        }
        img{
            width: 100%;
            height: 200px;
            
        }
        h3{
            margin-top: 1px;
            margin-right: 100px;
            font-weight: 100;
            font-size: 17px;
        }
        h2{
            font-weight: 1000;
            

        }
        
        button{
            width: 100%;
            margin-top: 10px;
            margin-bottom: 10px;
            padding: 10px;
            border-radius: 10px;
            border: 2px solid green;
            background-color: white;
            color: green;

        }
        p{
          margin-top: 1px;
        }
       
    </style>
</head>
<body>
    <section class="outer">
        <div class="container">
            
        <img src="./bur.png" alt="">
        <span class="discount">30% OFF</span>
        <article>
            <h2>Burger House</h2>
            <span><i class="fa-solid fa-star" style="color: green;"></i> 4.3</span>
            <h3>American,Fast Food</h3>
            <p> <i class="fa-regular fa-clock"></i> 30 - 40 mins</p>
            <span class="span3"> <i class="fa-solid fa-bicycle"></i> free Deivery</span>
            <button>View Menu</button>
        </article>
            
        
    </div>
    </section>
    
</body>
</html>
