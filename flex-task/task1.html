    <style>
        *{

        nav{
            /* border: 1px solid green; */
            display: flex;
            justify-content: center;

            padding: 20px;
            background-color: gray;
        }
        a{

        }
        a:hover{

        }
        h1{

            padding: 30px;

        }
        .card{
            width: 250px;
            text-align: center;
            border-radius: 12px;
            overflow: hidden;
            /* border: 2px solid  blue; */
            height: 290px;
            background-color: rgb(164, 199, 187);
            box-shadow: 1px 1px 2px grey;

        }
        img{
            width: 100%;
            height: 160px;
        }
        article{
            /* border: 1px solid yellow; */
            margin: 0   ;
            padding: 10px;
            background-color : rgb(159, 156, 156);
        }
        h2{
            margin-bottom: 10px
        }
        button{
            margin-bottom: 10px;
            width: 100%;
            border-radius: 7px;
            padding: 10px;
            border: none;
            box-shadow: 1px 1px 2px grey;
        }
        p{
            margin-bottom: 10px;
        }
        button:hover{
            cursor: pointer;
        }
    </style>
</head>
