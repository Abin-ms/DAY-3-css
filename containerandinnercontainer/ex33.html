<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Navigation Bar</title>
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        /* Fixed navbar using Flexbox for modern alignment */
        .outer {
            background-color: black;
            padding: 0 20px;
            height: 60px;
            display: flex;
            justify-content: center;
            align-items: center;
            gap: 30px; /* Clean spacing between nav items */
        }

        /* General styling for links directly inside navbar or container */
        .outer > a, 
        .container > a {
            color: white;
            text-decoration: none;
            font-size: 20px;
            transition: color 0.2s ease, transform 0.2s ease;
            display: inline-block;
        }

        /* Smooth hover state without shifting neighboring layout elements */
        .outer > a:hover, 
        .container > a:hover {
            color: aliceblue;
            transform: scale(1.15); 
        }

        /* Dropdown wrapper positioning */
        .container {
            position: relative;
            display: flex;
            align-items: center;
            height: 100%;
        }

        /* Hover trigger for showing dropdown */
        .container:hover .dropdown {
            display: block;
        }

        /* Positioned right under the parent link */
        .dropdown {
            display: none;
            position: absolute;
            top: 100%;
            left: 50%;
            transform: translateX(-50%); /* Centers dropdown under "Products" */
            background-color: #333;
            min-width: 140px;
            box-shadow: 0px 4px 8px rgba(0,0,0,0.3);
            border-radius: 4px;
            overflow: hidden;
            z-index: 10;
        }

        /* Dropdown links styling */
        .dropdown a {
            display: block;
            text-decoration: none;
            padding: 10px 15px;
            color: white;
            font-size: 16px;
            border-bottom: 1px solid #444;
            transition: background-color 0.2s ease;
        }

        .dropdown a:last-child {
            border-bottom: none;
        }

        .dropdown a:hover {
            background-color: #555;
            color: #fff;
        }
    </style>
</head>
<body>

    <nav class="outer">
        <a href="#">Home</a>

        <div class="container">
            <a href="#">Products</a>
            <div class="dropdown">
                <a href="#">Laptops</a>
                <a href="#">Phones</a>
                <a href="#">Watches</a>
                <a href="#">Shoes</a>
            </div>
        </div>

        <a href="#">Cart</a>
        <a href="#">Contact</a>
    </nav>

</body>
</html>
