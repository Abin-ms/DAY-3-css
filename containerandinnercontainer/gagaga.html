<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>

    <style>
        .outer{
            border: 1px solid grery;
            width: 300px;
            
            margin: auto;
            border-radius: 10px;
            overflow: hidden;
            box-shadow: 2px 2px 3px grey;
        }
        .dropdown{
            /* border: 2px solid blue; */
            width: 3000x;
            padding: 12px;
            height: 120px;
            margin: auto;
            text-align: center;
            display: none;
            background-color: red;
            

        }
        img{
            width: 100%;
            height: 300px;
            display: block;
        }
        button{
            border: none;
            padding: 7px 16px;
            background-color: red;
            border-radius: 10px;
            color: white;
        }
        .outer:hover:hover .dropdown{
            display: block;
        }
        button:hover{
            cursor: pointer;
        }
        span{
            color: goldenrod;
        }
    </style>

</head>
<body>
    
    <div class="outer">
        <img src="./image.png" alt="">
        <div class="dropdown">
                <p>Kill Bill</p>
                <p><span>&star;&star;&star;&star;&star;</span> 5/5</p>
                <button>Watch Trailer</button>
        </div>
    </div>
</body>
</html>
