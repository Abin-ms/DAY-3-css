<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <style>
        body{
            background-color: green;
        }
        div{
            margin-top:1000px ;
            border: 1px solid black;
            padding: 40px;
            width: 250px;
            margin: 50px auto;
            border-radius: 20px;
            background-color: grey;
            box-shadow: 2px 3px 7px;
           


        }
        input{
            margin: 6px;
            width: 85%;
            padding: 10px;
            border-radius: 10px;
            border: none;
            outline: none;
            
        }
        button{
            margin-top: 20px;
            padding: 10px;
            border-radius: 10px;
            width: 100% ;
            margin-bottom: 15px;
            box-shadow: 1px 3px 7px rgb(229, 68, 68);
        }
    </style>
</head>
<body>
    <div>
        <h1>Login</h1>
        <input type="text" placeholder="Enter your username">
        <input type="password" placeholder="Enter your password">
        <button>Login</button>
    </div>
</body>
</html>
